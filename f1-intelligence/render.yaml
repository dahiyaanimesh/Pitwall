services:
  - type: web
    name: f1-intelligence-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DB_PATH
        value: /opt/render/project/src/backend/database/f1.db
      - key: CORS_ORIGINS
        value: https://f1-intelligence.vercel.app,http://localhost:5173
    disk:
      name: f1-data
      mountPath: /opt/render/project/src/backend/database
      sizeGB: 1
